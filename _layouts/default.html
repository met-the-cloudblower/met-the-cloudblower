---
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#0d0805">
  <title>{% if page.title %}{{ page.title }} — {% endif %}The Cloudroom</title>
  <link rel="stylesheet" href="{{ '/assets/css/cloudroom.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="The Cloudroom home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>The Cloudroom</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#latest">Latest</a>
        <a href="{{ '/' | relative_url }}#archive">Archive</a>
        <a href="{{ '/tags/' | relative_url }}">Tags</a>
        <a href="{{ '/podcast/' | relative_url }}">Podcast</a>
        <a href="{{ '/' | relative_url }}#bio">Bio</a>
      </nav>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <span>The Cloudroom</span>
      <span>quiet signals from the edge of the night</span>
    </footer>
  </div>
</body>
</html>
